services:

  api:
    build: .
    env_file: .env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started

    command: >
      sh -c
      "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:80"

    depends_on:
      - api

    environment:
      VITE_API_URL: http://api:8000

  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_DB: rescuebite
      POSTGRES_USER: rescuebite
      POSTGRES_PASSWORD: rescuebite

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuebite -d rescuebite"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

  worker:
    build: .

    env_file: .env

    depends_on:
      - db
      - redis

    command: >
      celery
      -A app.workers.email_worker.celery_app
      worker
      --loglevel=info

volumes:
  postgres_data: